name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features ogh-device/testing --locked -- -D warnings
      - run: cargo clippy --workspace --lib --locked -- -D warnings
      - run: cargo test --workspace --features ogh-device/testing --locked

  windows-gnu:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y gcc-mingw-w64-x86-64
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets --features ogh-device/testing --locked --target x86_64-pc-windows-gnu -- -D warnings
      - run: cargo build --workspace --release --locked --target x86_64-pc-windows-gnu
      - uses: actions/upload-artifact@v4
        with:
          name: open-g-hub-windows-x86_64
          path: |
            target/x86_64-pc-windows-gnu/release/ogh.exe
            target/x86_64-pc-windows-gnu/release/ogh-daemon.exe
            target/x86_64-pc-windows-gnu/release/ogh-gui.exe
            target/x86_64-pc-windows-gnu/release/ogh-tray.exe
          if-no-files-found: error
