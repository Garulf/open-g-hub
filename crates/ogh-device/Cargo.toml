[package]
name = "ogh-device"
version = "0.1.0"
edition = "2024"

[features]
testing = []

[dependencies]
ogh-protocol = { path = "../ogh-protocol" }
serde = { version = "1.0.229", features = ["derive"] }
toml = { version = "1.1.8", default-features = false, features = ["std", "serde", "parse"] }

[target.'cfg(windows)'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["windows-native"] }
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Diagnostics_ToolHelp"] }

[target.'cfg(target_os = "linux")'.dependencies]
hidapi = { version = "2.6.7", default-features = false, features = ["linux-native-basic-udev"] }

[target.'cfg(not(any(windows, target_os = "linux")))'.dependencies]
hidapi = "2.6.7"

[dev-dependencies]
ogh-device = { path = ".", features = ["testing"] }
hex = "0.4.3"
serde_json = "1.0.154"
