# Calls open-g-hub may send: each (feature id, function) G Hub was seen
# sending, citing the fixture that shows it. Deny entries win and cannot
# overlap an allow entry; a deny entry without a function covers the feature.

# Root getFeature
[[allow]]
feature = 0x0000
function = 0
seen_in = "session-a/ghub-launch"

