[package]
name = "ogh-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lib]
name = "ogh_cli"
path = "src/lib.rs"

[[bin]]
name = "ogh"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ogh-ipc = { path = "../ogh-ipc" }
ogh-protocol = { path = "../ogh-protocol" }
serde_json = "1.0.154"

[dev-dependencies]
tempfile = "3"
