[package]
name = "ogh-cli"
version = "0.1.0"
edition = "2024"

[lib]
name = "ogh_cli"
path = "src/lib.rs"

[[bin]]
name = "ogh"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ctrlc = "3.5.2"
ogh-device = { path = "../ogh-device" }
ogh-protocol = { path = "../ogh-protocol" }
serde_json = "1.0.154"

[dev-dependencies]
ogh-device = { path = "../ogh-device", features = ["testing"] }
