[package]
name = "ogh-cli"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true

[lib]
name = "ogh_cli"
path = "src/lib.rs"

[[bin]]
name = "ogh"
path = "src/main.rs"

[dependencies]
clap = { version = "4", features = ["derive"] }
ogh-ipc = { path = "../ogh-ipc" }
ogh-protocol = { path = "../ogh-protocol" }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Registry",
] }

[dev-dependencies]
tempfile = "3"
