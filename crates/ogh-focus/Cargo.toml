[package]
name = "ogh-focus"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true

[dependencies]
crossbeam-channel = "0.5"
serde_json = "1"
tracing = "0.1"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_UI_Accessibility",
    "Win32_UI_WindowsAndMessaging",
] }

[dev-dependencies]
tempfile = "3"
