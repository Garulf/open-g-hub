[package]
name = "ogh-ipc"
version = "0.1.1"
edition = "2024"
rust-version.workspace = true

[dependencies]
interprocess = "2.4"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_System_Pipes", "Win32_Foundation"] }
